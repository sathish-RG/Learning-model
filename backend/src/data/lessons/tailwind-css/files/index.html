<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile card</title>
    <!-- Tailwind CSS (already set up for you) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Style this card using only Tailwind classes -->
    <article>
      <header>
        <img
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-images/painted-hand-298-332.jpg"
          alt="Profile photo of Priya"
          width="64"
          height="64"
        />
        <div>
          <h1>Priya Sharma</h1>
          <p>Front-end developer</p>
        </div>
      </header>

      <p>I build friendly, accessible websites and I'm currently learning React. Coffee-powered, cat-approved.</p>

      <button type="button">Follow</button>
    </article>
  </body>
</html>
