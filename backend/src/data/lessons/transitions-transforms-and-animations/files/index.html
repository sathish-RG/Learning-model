<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion lab</title>
    <style>
      /* Given: colors and spacing (you'll write the motion in styles.css) */
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: hsl(260 30% 97%); color: hsl(260 15% 20%); }
      main { max-width: 520px; margin: 0 auto; padding: 24px; }
      .notification { background: hsl(150 60% 90%); border: 2px solid hsl(150 50% 60%); padding: 12px 16px; border-radius: 12px; font-weight: 600; }
      .buttons { margin: 24px 0; }
      .btn { background: hsl(260 70% 55%); color: white; border: 0; padding: 12px 20px; border-radius: 12px; font: inherit; font-weight: 700; margin-right: 8px; cursor: pointer; }
      .card { background: white; border: 2px solid hsl(260 30% 88%); border-radius: 16px; padding: 20px; }
      .card h2 { margin-top: 0; }
      .loading { margin-top: 24px; }
      .spinner { width: 40px; height: 40px; border: 5px solid hsl(260 30% 85%); border-top-color: hsl(260 70% 55%); border-radius: 50%; }
    </style>
    <!-- Your styles load last, so they win any tie with the given styles above -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="notification">✅ Your profile was saved.</p>

      <div class="buttons">
        <button class="btn" type="button">Hover me</button>
        <button class="btn" type="button">Press me</button>
      </div>

      <article class="card">
        <h2>Hover this card</h2>
        <p>Small, quick movements make an interface feel friendly.</p>
      </article>

      <div class="loading">
        <div class="spinner" role="status" aria-label="Loading"></div>
      </div>
    </main>
  </body>
</html>
