<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FlexFit</title>
    <style>
      /* Given: colors and spacing (you'll write the Flexbox layout in styles.css) */
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; color: hsl(220 15% 20%); }
      .navbar { padding: 12px 24px; background: white; border-bottom: 1px solid hsl(220 20% 90%); }
      .logo { font-weight: 800; font-size: 1.25rem; }
      .nav-links { list-style: none; margin: 0; padding: 0; }
      .nav-links a { color: inherit; text-decoration: none; }
      .nav-button, .button { background: hsl(150 60% 38%); color: white; border: 0; padding: 10px 18px; border-radius: 10px; font-weight: 700; }
      .button.secondary { background: white; color: hsl(150 60% 30%); }
      .hero { min-height: 60vh; background: hsl(220 40% 18%); color: white; text-align: center; padding: 24px; }
      .hero h1 { font-size: 2.25rem; margin: 0 0 12px; }
      .hero p { margin: 0 0 20px; opacity: 0.85; }
      .features { padding: 24px; }
      .feature { background: hsl(220 30% 96%); border-radius: 12px; padding: 16px; }
      .feature h2 { font-size: 1.1rem; margin-top: 0; }
    </style>
    <!-- Your styles load last, so they win any tie with the given styles above -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar" aria-label="Main">
      <span class="logo">FlexFit</span>
      <ul class="nav-links">
        <li><a href="#">Workouts</a></li>
        <li><a href="#">Plans</a></li>
        <li><a href="#">Pricing</a></li>
      </ul>
      <button class="nav-button" type="button">Sign up</button>
    </nav>

    <section class="hero">
      <div class="hero-content">
        <h1>Get fit, flexibly</h1>
        <p>Short workouts that fit around your day.</p>
        <div class="hero-actions">
          <button class="button" type="button">Start free</button>
          <button class="button secondary" type="button">See plans</button>
        </div>
      </div>
    </section>

    <section class="features">
      <article class="feature">
        <h2>5-minute workouts</h2>
        <p>Perfect for busy mornings.</p>
      </article>
      <article class="feature">
        <h2>No equipment</h2>
        <p>Train anywhere: your room, a park, a hotel.</p>
      </article>
      <article class="feature">
        <h2>Track progress</h2>
        <p>See your streak grow every week.</p>
      </article>
    </section>
  </body>
</html>
